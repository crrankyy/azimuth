schema: 1
project:
  name: azimuth
  description: "File-based project management for codebases built by one developer directing AI agents: a CLI, a live viewer and a Claude Code plugin."
  mode: brownfield # greenfield | brownfield
stack:
  languages: [typescript]
  package_manager: pnpm
  test_runner: vitest
  display: [TypeScript, Node.js, React, Vite]
commands:
  build: pnpm build
  typecheck: pnpm typecheck
  test: pnpm test
  lint: pnpm lint
  format: pnpm format
tests:
  globs: ["test/**/*.test.ts", "viewer/src/**/*.test.{ts,tsx}", "!test/fixtures/**"] # fixtures are sample projects
git:
  log_depth: 500
  agent_pattern: Claude # Co-Authored-By text that marks a commit as agent-made
  arch_stale_after_commits: 10
autonomy:
  approve_specs: auto # auto: agents approve specs that pass every gate; manual: only you
  accept_adrs: auto # auto: agents accept their own decisions; manual: only you
  strict: false # true: automatic approval also requires zero warnings
stale_after_days: 5
verify:
  timeout_seconds: 600
  output_tail_lines: 40
  # Docs no code or test reads. docs/cli.md, concepts.md and file-format.md are bundled into the
  # CLI (`azimuth docs`), so they stay out.
  ignore_paths:
    - README.md
    - CHANGELOG.md
    - CLAUDE.md
    - AGENTS.md
    - docs/README.md
    - docs/architecture.md
    - docs/claude-code.md
    - docs/development.md
    - docs/getting-started.md
    - docs/viewer.md
viewer:
  port: 4319
  autostart: true # Claude Code sessions start the viewer automatically
  editor_url: null # e.g. "vscode://file/{abs}:{line}"
